<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: draw under the notch/home bar; the app pads itself with the safe-area insets.
         maximum-scale=1 stops iOS zooming in when a text field is focused (pinch zoom still works). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Flex</title>
    <meta name="description" content="Flex workout timer. Private: no account, no ads, nothing collected." />
    <meta name="theme-color" content="#F2EEE3" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />

    <!-- Installable: web app manifest + Apple home-screen tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The react-native-web root reset, plus the app's paper background so nothing flashes white. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #f2eee3;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Flex needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
